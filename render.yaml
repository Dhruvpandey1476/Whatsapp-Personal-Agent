# Render Blueprint: New + -> Blueprint -> pick this repo. Creates the web service + a free Postgres.
# Secrets marked sync:false are entered in the Render dashboard (never committed).
services:
  - type: web
    name: whatsapp-personal-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-agent-db
          property: connectionString
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: API_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: ""
      - key: LLM_FALLBACK_PROVIDER
        value: gemini
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_MODEL
        value: gemini-flash-lite-latest
      - key: TAVILY_API_KEY
        sync: false
      - key: MAX_ORDER_AMOUNT
        value: "200000"
      - key: TIMEZONE
        value: Asia/Kolkata

databases:
  - name: whatsapp-agent-db
    plan: free
